about:
  title: About CDH
  paragraphs:
    - "Commercial Door & Hardware focuses on one scope: **Division 08 openings**. Doors, frames and hardware are all we quote, so the takeoff is read the way an installer reads it and the hardware schedule is built the way the locking plan requires."
    - "Our leadership spent **ten years supervising door and hardware installers** before running CDH as a supply house. That shows in how we put packages together: complete openings, hardware grouped by set, and material sequenced the way the job is built."
    - "CDH holds **five DHI credentials** covering architectural hardware consulting, electrified hardware, and door and hardware technology. When your project has access control, rated assemblies or a complicated keying schedule, the person quoting it is credentialed to get it right."
