supply:
  title: What we supply
  intro: Doors, frames and hardware are quoted together as one package, so nothing gets split between vendors or missed between scopes.
  products:
    - name: Commercial doors
      section: Section 08 14 00
      description: Hollow metal, architectural wood, and aluminum and glass doors for rated and non-rated openings.
      items:
        - Hollow metal doors
        - Architectural wood doors
        - Fire-rated assemblies
        - Aluminum and glass doors
        - Lead-lined and specialty doors
    - name: Door frames
      section: Section 08 12 00
      description: Hollow metal and aluminum frames matched to the door schedule and wall conditions.
      items:
        - Welded and knock-down frames
        - Aluminum frames
        - Sidelights and transoms
        - Borrowed lights
        - Fire-rated frames
    - name: Door hardware
      section: Section 08 71 00
      description: Finish hardware scheduled by hardware set and keyed to your requirements, including electrified hardware for access-controlled openings.
      items:
        - Locksets and exit devices
        - Closers and hinges
        - Electrified hardware
        - Access control coordination
        - Keying schedules
    - name: Storefront and entrances
      section: Section 08 41 00
      description: Aluminum storefront doors and entrance packages for retail, mixed-use and tenant improvement work.
      items:
        - Aluminum storefront doors
        - Entrance pairs and singles
        - Pulls, pivots and closers
        - Panic hardware
  note: "**Division 10 specialties** are also bid and supplied with the door package: bathroom accessories, toilet compartments, fire protection specialties and lockers."

process:
  title: How we work
  intro: Send us the invitation and the plan set. We work the takeoff, quote and delivery around your bid date.
  steps:
    - title: Send the bid invitation
      text: Forward the ITB, or add us in BuildingConnected or Procore. Plans and specs are all we need to start.
    - title: Takeoff and quote
      text: A door-by-door takeoff against the door schedule and hardware sets, with scope questions raised early and pricing in before your deadline.
    - title: Submittals
      text: Product submittals, hardware schedules and keying coordination, handled by DHI-credentialed staff before anything is ordered.
    - title: Staged delivery
      text: Material is released in the order your job needs it. Frames arrive ahead of doors, and hardware comes keyed and labeled by opening.
  note: "**We are a supplier only.** We don't install. Your crew or installer hangs the openings, and we make sure the right material shows up complete and on schedule."

