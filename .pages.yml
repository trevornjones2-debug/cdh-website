# Pages CMS editor settings (app.pagescms.org). Sign in with GitHub, open this repository,
# and choose "Website content" to edit the site. Uploaded photos are saved in the images folder.
media:
  input: images
  output: images

content:
  - name: site
    label: Website content
    type: file
    path: _data/site.yml
    fields:
      - name: company
        label: Company name
        type: string
      - name: legal_name
        label: Legal name (footer)
        type: string
      - name: contact
        label: Contact details
        type: object
        fields:
          - { name: phone, label: Phone (as shown), type: string }
          - { name: phone_link, label: "Phone for tap-to-call (digits only, with +1)", type: string }
          - { name: email, label: Email shown on the site, type: string }
          - { name: address_line1, label: Address line 1, type: string }
          - { name: address_line2, label: Address line 2, type: string }
          - { name: hours, label: Hours, type: string }
      - name: seo_description
        label: Search engine description
        type: text
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: image, label: Background photo, type: image }
      - name: credentials_label
        label: Credentials heading
        type: string
      - name: credentials
        label: Credentials
        type: object
        list: true
        fields:
          - { name: code, label: Abbreviation, type: string }
          - { name: name, label: Full name, type: string }
      - name: supply
        label: What we supply
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: products
            label: Product groups
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: section, label: Spec section, type: string }
              - { name: description, label: Description, type: text }
              - { name: items, label: Items, type: string, list: true }
          - { name: note, label: "Note under the cards (use **bold** for bold)", type: text }
      - name: process
        label: How we work
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: steps
            label: Steps (in order)
            type: object
            list: true
            fields:
              - { name: title, label: Step title, type: string }
              - { name: text, label: Step text, type: text }
          - { name: note, label: "Note under the steps (use **bold** for bold)", type: text }
      - name: projects
        label: Projects
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: list
            label: Projects
            type: object
            list: true
            fields:
              - { name: name, label: Project name, type: string }
              - { name: location, label: "City, State", type: string }
              - { name: sector, label: Sector, type: string }
              - { name: description, label: Description, type: text }
              - { name: image, label: Photo, type: image }
              - { name: link, label: Link (optional), type: string }
              - { name: link_label, label: Link text, type: string }
      - name: markets
        label: Markets and service area
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - name: list
            label: Markets
            type: object
            list: true
            fields:
              - { name: name, label: Market, type: string }
              - { name: text, label: Description, type: text }
          - { name: area_title, label: Service area title, type: string }
          - { name: area_text, label: Service area text, type: text }
          - { name: home_state, label: Home state (highlighted), type: string }
          - { name: states, label: Other states, type: string, list: true }
      - name: about
        label: About and team
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: paragraphs, label: "Paragraphs (use **bold** for bold)", type: text, list: true }
          - name: facts
            label: Company facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
          - { name: team_title, label: Team heading, type: string }
          - name: team
            label: Team members
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: role, label: Title, type: string }
      - name: quote
        label: Quote request form
        type: object
        fields:
          - { name: title, label: Section title, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: form_endpoint, label: "Form delivery address (FormSubmit link)", type: string }
          - { name: email_subject, label: Email subject for requests, type: string }
          - { name: packages, label: Package choices, type: string, list: true }
          - { name: success_message, label: Message after sending, type: text }
      - name: footer_text
        label: Footer text
        type: text
